<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>わたしの人生帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@600;700&display=swap">
<style>
/* Layout: 手帳の見開き。上に日付の帯、中は一列のページ、下に見出しタブ（スマホ）。
   Color: 青みの紙・墨・藍の栞。役割は目標の色で控えめに塗り分ける。 */
:root{
  --paper:#f2f4f6; --sheet:#fbfcfd; --ink:#1d2430; --muted:#5c6676; --rule:#d8dde5; --soft:#e8ecf1;
  --ai:#2c4a86; --ai-soft:#e3e9f5; --late:#a8322a; --late-soft:#f6e3e1; --ok:#2f6b4a; --ok-soft:#e1efe6;
  --g-green:#3f7a55; --g-teal:#2f7a78; --g-blue:#3a64a8; --g-purple:#6a4f9a; --g-orange:#b2652a; --g-rose:#a8506a; --g-gold:#9a7a1f; --g-gray:#6b7280;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --l1:#2b3550; --l2:#3f4f7a; --l3:#56709e; --l4:#b7c7dd; --l5:#d6e0ec;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14181e; --sheet:#1b2028; --ink:#e6e9ee; --muted:#9aa4b3; --rule:#2e3542; --soft:#232a35;
  --ai:#8fa9e0; --ai-soft:#24304a; --late:#f08a80; --late-soft:#3a2222; --ok:#7fc79c; --ok-soft:#1f3128;
  --g-green:#7fbf94; --g-teal:#6cc0bc; --g-blue:#8fb0ea; --g-purple:#b39be0; --g-orange:#e6a06a; --g-rose:#e28ea6; --g-gold:#d9bb5c; --g-gray:#a3abb8;
  --l1:#c9d4ee; --l2:#a9badf; --l3:#8aa1cc; --l4:#4a5f87; --l5:#37465f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14181e; --sheet:#1b2028; --ink:#e6e9ee; --muted:#9aa4b3; --rule:#2e3542; --soft:#232a35;
  --ai:#8fa9e0; --ai-soft:#24304a; --late:#f08a80; --late-soft:#3a2222; --ok:#7fc79c; --ok-soft:#1f3128;
  --g-green:#7fbf94; --g-teal:#6cc0bc; --g-blue:#8fb0ea; --g-purple:#b39be0; --g-orange:#e6a06a; --g-rose:#e28ea6; --g-gold:#d9bb5c; --g-gray:#a3abb8;
  --l1:#c9d4ee; --l2:#a9badf; --l3:#8aa1cc; --l4:#4a5f87; --l5:#37465f;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--ai)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:1.15rem;font-weight:700;letter-spacing:.04em;margin:0}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;text-align:right;line-height:1.3}
.date b{display:block;color:var(--ink);font-size:1.05rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);padding:10px 6px;font-size:.88rem;white-space:nowrap;border-top:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--ai)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{padding-inline:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px))}
main{padding-block:20px 110px}
h2.view{font-family:var(--f-display);font-size:1.5rem;line-height:1.35;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;font-size:.92rem}
h3{font-size:1rem;margin:0;text-wrap:balance}
.sec{display:grid;gap:10px;margin-block:22px}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.sec>header .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.label{font-size:.75rem;letter-spacing:.08em;color:var(--muted)}
.countdowns{display:flex;gap:10px;flex-wrap:wrap}
.cd{flex:1 1 220px;min-width:0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:inherit;display:grid;gap:2px}
.cd .n{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.cd .n small{font-family:var(--f-body);font-size:.85rem;color:var(--muted);margin-left:4px}
.cd .t{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
ul.todos{list-style:none;margin:0;padding:0;display:grid}
ul.todos li{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:9px 0;border-bottom:1px dashed var(--rule)}
ul.todos li:last-child{border-bottom:0}
.box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;margin-top:5px}
li.done .box{background:var(--ok);border-color:var(--ok)}
li.done .tt{color:var(--muted);text-decoration:line-through}
.tt{min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.8rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.meta a{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;line-height:1.5;padding:0 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late);font-weight:700}
.pill.doing{background:var(--ai-soft);color:var(--ai)}
.pill.cand{border:1px dashed var(--muted);background:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.a{background:var(--ink);color:var(--sheet);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--c,var(--g-gray))}
.role{margin-block:26px;display:grid;gap:10px}
.role>header{display:grid;gap:2px}
.role>header h3{font-family:var(--f-display);font-size:1.2rem}
.role>header p{margin:0;color:var(--muted);font-size:.9rem}
.goal{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--c,var(--g-gray));border-radius:4px var(--r) var(--r) 4px;padding:12px 14px;display:grid;gap:6px}
.goal a.ttl{color:var(--ink);text-decoration:none;font-weight:700;overflow-wrap:anywhere}
.goal a.ttl:hover{text-decoration:underline}
.goal .kids{display:grid;gap:6px;margin-top:4px;padding-left:10px;border-left:1px solid var(--rule)}
.goal .kid{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.goal .kid a{color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--g-gray))}
.paper{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.prose{min-width:0;overflow-wrap:anywhere}
.prose p{margin:0 0 .6em}.prose p:last-child{margin:0}
.prose ul{margin:0 0 .6em;padding-left:1.2em}
.prose h4{margin:.6em 0 .2em;font-size:.95rem}
.crumbs{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px}
.crumbs a{color:var(--muted)}
.mission{font-family:var(--f-display);font-size:1.2rem;line-height:1.8;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid2>*{min-width:0}
details.fold>summary{cursor:pointer;color:var(--muted);font-size:.88rem;padding:6px 0}
.dec{display:grid;gap:6px}
.dec .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.hint{font-size:.85rem;color:var(--muted);background:var(--ai-soft);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.hint code{font-family:var(--f-body);background:var(--sheet);padding:1px 6px;border-radius:4px;color:var(--ink)}
.copy{font:inherit;font-size:.8rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer}
.empty{color:var(--muted);font-size:.9rem;margin:0}
footer.foot{color:var(--muted);font-size:.8rem;margin-top:30px;display:grid;gap:4px}
/* 地図（層の図解） */
.pyr{display:grid;justify-items:center;gap:4px;margin-block:8px 6px}
.pyr .band{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;border-radius:6px;color:var(--sheet);font-weight:700;font-size:.9rem;min-width:0}
.pyr .band span{font-variant-numeric:tabular-nums;font-weight:400;opacity:.9;white-space:nowrap}
.L1{background:var(--l1)}.L2{background:var(--l2)}.L3{background:var(--l3)}.L4{background:var(--l4);color:var(--ink)!important}.L5{background:var(--l5);color:var(--ink)!important}
.chip{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:0 7px;border-radius:4px;color:var(--sheet);line-height:1.7;white-space:nowrap;flex:none}
dl.layers{display:grid;gap:10px;margin:14px 0 0}
dl.layers>div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
dl.layers dt{grid-row:span 2}
dl.layers dd{margin:0;min-width:0;overflow-wrap:anywhere}
dl.layers dd.ex{color:var(--muted);font-size:.85rem}
.ladder{display:grid;gap:0}
.ladder .rung{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;position:relative}
.ladder .rung+.rung::before{content:"なぜ？ ↑";position:absolute;top:-10px;left:2px;font-size:.7rem;color:var(--muted);background:var(--paper);padding:0 4px}
.ladder .rung .tx{min-width:0;overflow-wrap:anywhere}
.ladder .rung+.rung{border-top:1px dashed var(--rule);margin-top:6px}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--rule);display:grid;gap:6px}
.tree>ul{border-left:0;padding-left:0}
.tree li{position:relative;display:grid;gap:6px}
.tree li>.node{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;min-width:0}
.tree li>.node a{color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}
.tree li>.node a:hover{text-decoration:underline}
.tree .tcount{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
details.rolemap{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px}
details.rolemap>summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.rolemap>summary h3{font-family:var(--f-display);font-size:1.1rem}
details.rolemap .tree{margin-top:10px}
/* 合言葉の画面 */
.lock{min-height:80vh;display:grid;place-items:center}
.lock form{width:min(100%,380px);display:grid;gap:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:22px}
.lock h1{font-family:var(--f-display);font-size:1.5rem;margin:0}
.lock .passrow{display:flex;gap:8px;align-items:stretch}
.lock .passrow input{flex:1;min-width:0}
.lock .masked{-webkit-text-security:disc;text-security:disc}
.lock .passrow input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.lock button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--ai);color:var(--sheet);cursor:pointer}
.lock .passrow button{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);font-weight:400;padding:0 12px}
.lock .err{color:var(--late);font-size:.88rem;margin:0}
@media (min-width:760px){.tabbar{display:none}}
@media (max-width:759px){header.top nav.tabs{display:none}}
@media (prefers-reduced-motion:no-preference){.view-in{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

const app = document.getElementById('app');
const TABS = [['today','今日'],['map','地図'],['goals','目標'],['decisions','判断'],['me','わたし'],['log','記録']];
const WD = '日月火水木金土';
let D = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jst = () => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());
const addDays = (d,n) => { const x = new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const diff = (a,b) => Math.round((Date.parse(b+'T12:00:00Z') - Date.parse(a+'T12:00:00Z'))/864e5);
const jpDate = d => { const x = new Date(d+'T12:00:00Z'); return `${x.getUTCMonth()+1}月${x.getUTCDate()}日（${WD[x.getUTCDay()]}）`; };
const shortDate = d => { const x = new Date(d+'T12:00:00Z'); return `${x.getUTCMonth()+1}/${x.getUTCDate()}`; };

// 小さなMarkdown表示（見出し・箇条書き・リンク・太字だけ）
function inline(s){
  return esc(s)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function md(s){
  if(!s) return '';
  const out=[]; let list=false;
  for(const raw of s.split('\n')){
    const l=raw.trimEnd();
    if(/^\s*[-*] /.test(l)){ if(!list){out.push('<ul>');list=true;} out.push('<li>'+inline(l.replace(/^\s*[-*] /,''))+'</li>'); continue; }
    if(list){out.push('</ul>');list=false;}
    if(!l.trim()) continue;
    const h=l.match(/^#{2,4} (.+)/); if(h){ out.push('<h4>'+inline(h[1])+'</h4>'); continue; }
    out.push('<p>'+inline(l)+'</p>');
  }
  if(list) out.push('</ul>');
  return out.join('');
}

const goalById = id => D.goals.find(g => g.id === id);
const colorOf = g => `var(--g-${(g && g.color) || 'gray'})`;
const ancestors = g => { const a=[]; let p=g.parent; while(p){ const x=goalById(p); if(!x) break; a.unshift(x); p=x.parent; } return a; };
const children = id => D.goals.filter(g => g.parent === id);
const closed = g => g.status === '完了' || g.status === '見送り';
const descendants = id => children(id).flatMap(c => [c, ...descendants(c.id)]);
const todosOf = id => D.todos.filter(t => t.goal === id);
const roleName = id => (D.roles.find(r => r.id === id) || {}).name || id;

function todoItem(t, opts={}){
  const today = jst(); const g = goalById(t.goal);
  const pills = [];
  if(t.priority==='A') pills.push('<span class="pill a">A</span>');
  if(t.doing) pills.push('<span class="pill doing">進行中</span>');
  if(t.candidate) pills.push('<span class="pill cand">候補</span>');
  if(t.ai) pills.push('<span class="pill cand">AI案</span>');
  if(t.due && !t.done){ const n=diff(today,t.due); pills.push(n<0?`<span class="pill late">期限 ${shortDate(t.due)}（${-n}日超過）</span>`:`<span class="pill">期限 ${shortDate(t.due)}${n<=7?`（あと${n}日）`:''}</span>`); }
  if(t.planned) pills.push(`<span class="pill">予定 ${shortDate(t.planned)}${t.time?' '+t.time+(t.end?'〜'+t.end:''):''}</span>`);
  if(t.cal) pills.push('<span class="pill ok">カレンダー登録済</span>');
  if(t.wait) pills.push(`<span class="pill">待ち：${esc(t.wait)}</span>`);
  if(t.done && t.completed) pills.push(`<span class="pill ok">完了 ${shortDate(t.completed)}</span>`);
  const where = opts.showGoal && g ? `<a href="#goal-${esc(g.id)}"><span class="dot" style="--c:${colorOf(g)}"></span> ${esc(g.title)}</a>` : '';
  return `<li class="${t.done?'done':''}"><span class="box" aria-hidden="true"></span><div class="tt">${esc(t.title)}<div class="meta">${pills.join('')}${where}</div></div></li>`;
}
const todoList = (items, opts={}) => {
  if(!items.length) return '<p class="empty">ありません。</p>';
  const lim = opts.limit ?? 5, head = items.slice(0, lim), rest = items.slice(lim);
  return `<ul class="todos">${head.map(t => todoItem(t, opts)).join('')}</ul>` + (rest.length ? `<details class="fold"><summary>残り ${rest.length}件を表示</summary><ul class="todos">${rest.map(t => todoItem(t, opts)).join('')}</ul></details>` : '');
};
const sec = (title, inner, count) => `<section class="sec"><header><h3>${title}</h3>${count!=null?`<span class="count">${count}件</span>`:''}</header>${inner}</section>`;

function routineToday(r, day){
  const d=new Date(day+'T12:00:00Z');
  if(r.rule==='毎日') return true;
  const w=r.rule.match(/^毎週:(.+)$/); if(w) return w[1].includes('月火水木金土日'[(d.getUTCDay()+6)%7]);
  const m=r.rule.match(/^毎月:(\d+)$/); if(m){ const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate(); return d.getUTCDate()===Math.min(+m[1],last); }
  return false;
}

/* ---------- 今日 ---------- */
function viewToday(){
  const day = jst(), soon = addDays(day,7);
  const open = D.todos.filter(t => !t.done && !t.candidate);
  const late = open.filter(t => t.due && t.due < day).sort((a,b)=>a.due.localeCompare(b.due));
  const todays = open.filter(t => t.planned === day).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  const near = open.filter(t => t.due && t.due >= day && t.due <= soon).sort((a,b)=>a.due.localeCompare(b.due));
  const shown = new Set([...late,...todays,...near]);
  const doing = open.filter(t => t.doing && !shown.has(t));
  const prioA = open.filter(t => t.priority==='A' && !shown.has(t) && !doing.includes(t));
  const routines = D.routines.filter(r => routineToday(r, day));
  const milestones = D.goals.filter(g => g.due && !closed(g) && g.due >= day).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3);
  // 急ぎではないが大切なこと：家族・夫婦・健康・楽しみ・仲間の目標で、選ばれたToDoがまだないもの
  const q2 = D.goals.filter(g => !g.parent && !closed(g) && g.roles.some(r => ['father','husband'].includes(r) || ['health','enjoy','friends','partner','family'].includes(g.id)))
    .filter(g => ![g, ...descendants(g.id)].some(x => todosOf(x.id).some(t => !t.done && !t.candidate)));
  const reviewDue = D.decisions.filter(d => d.status!=='置き換え済み' && d.review && d.review <= day);
  return `<div class="view-in">
    <h2 class="view">${jpDate(day)}</h2>
    <p class="lead">選ぶのは自分。迷ったら Claude に「人生帳：今日の焦点は？」と聞けば、カレンダーの予定と合わせて考えます。</p>
    ${milestones.length?`<div class="countdowns">${milestones.map(g=>`<a class="cd" href="#goal-${esc(g.id)}" style="--c:${colorOf(g)}"><span class="label"><span class="dot"></span> ${esc(roleName(g.roles[0]))}</span><span class="n">${diff(day,g.due)}<small>日</small></span><span class="t">${esc(g.title)}（${shortDate(g.due)}）</span></a>`).join('')}</div>`:''}
    ${todays.length?sec('今日の予定', todoList(todays,{showGoal:true}), todays.length):''}
    ${routines.length?sec('今日の繰り返し', `<ul class="todos">${routines.map(r=>`<li><span class="box"></span><div class="tt">${esc(r.title)}<div class="meta"><span class="pill">${esc(r.rule)}</span></div></div></li>`).join('')}</ul>`, routines.length):''}
    ${late.length?sec('期限を過ぎたもの', `<p class="empty">終わっているものは「〇〇は終わった」と伝えれば完了にします。</p>`+todoList(late,{showGoal:true}), late.length):''}
    ${sec('7日以内に期限', todoList(near,{showGoal:true}), near.length)}
    ${doing.length?sec('進行中', todoList(doing,{showGoal:true}), doing.length):''}
    ${prioA.length?sec('優先度A', todoList(prioA,{showGoal:true}), prioA.length):''}
    ${q2.length?sec('急ぎではないけれど大切なこと', `<p class="empty">まだ一歩が決まっていない目標です。候補から選ぶか、やりたいことを話してください。</p><div class="grid2">${q2.map(g=>{const c=todosOf(g.id).filter(t=>t.candidate&&!t.done)[0];return `<a class="goal" href="#goal-${esc(g.id)}" style="--c:${colorOf(g)};text-decoration:none;color:inherit"><span class="ttl" style="font-weight:700">${esc(g.title)}</span>${c?`<span class="meta"><span class="pill cand">候補</span> ${esc(c.title)}</span>`:''}</a>`}).join('')}</div>`):''}
    ${reviewDue.length?sec('見直し時期が来た判断', reviewDue.map(d=>`<p><a href="#decisions">${esc(d.id)}</a></p>`).join('')):''}
  </div>`;
}

/* ---------- 地図（層の図解） ---------- */
const LAYERS=[['L1','ミッション','一生を通じてありたい姿。すべての判断の一番上の基準。'],['L2','役割','父・夫・社会人・個人事業・自分。人生の持ち場ごとにありたい姿を持つ。'],['L3','目標','役割の下で育てたい方向や、達成したいこと。'],['L4','案件','目標を実現するための具体的な取り組み（期限や成果物がある）。'],['L5','ToDo','今日・今週に手を動かす一歩。']];
const chip=(lv)=>{const l=LAYERS.find(x=>x[0]===lv);return `<span class="chip ${lv}">${l[1]}</span>`;};
const layerOf=g=>g.parent?'L4':'L3';
function viewMap(){
  const tops=D.goals.filter(g=>!g.parent&&!closed(g)), projects=D.goals.filter(g=>g.parent&&!closed(g));
  const openT=D.todos.filter(t=>!t.done&&!t.candidate), cand=D.todos.filter(t=>!t.done&&t.candidate);
  const counts={L1:'1',L2:String(D.roles.length),L3:String(tops.length),L4:String(projects.length),L5:`${openT.length}（候補 ${cand.length}）`};
  const widths=['44%','58%','72%','86%','100%'];
  const ex={L1:D.profile.mission.slice(0,40)+(D.profile.mission.length>40?'…':''),L2:D.roles.map(r=>r.name).join('・'),L3:tops.slice(0,3).map(g=>g.title).join('／'),L4:projects.slice(0,3).map(g=>g.title).join('／'),L5:openT.slice(0,2).map(t=>t.title).join('／')};
  // 「なぜ？」のはしご：進行中で、いちばん深い案件につながるToDoを例にする
  const depth=t=>{const g=goalById(t.goal);return g?ancestors(g).length+1:0;};
  const sample=openT.filter(t=>t.goal).sort((a,b)=>(b.doing-a.doing)||(depth(b)-depth(a)))[0];
  let ladder='';
  if(sample){
    const g=goalById(sample.goal), chain=[...ancestors(g),g].reverse();
    const role=D.roles.find(r=>r.id===(chain[chain.length-1].roles[0]));
    const rungs=[[ 'L5', esc(sample.title)], ...chain.map(x=>[layerOf(x), `<a href="#goal-${esc(x.id)}">${esc(x.title)}</a>`]), ...(role?[['L2', `${esc(role.name)}：${esc(role.vision)}`]]:[]), ['L1', esc(D.profile.mission)]];
    ladder=sec('このToDoは何のため？', `<p class="empty">下から上へ「なぜ？」をたどると、日々の一歩がミッションにつながります。</p><div class="paper ladder">${rungs.map(([lv,tx])=>`<div class="rung">${chip(lv)}<div class="tx">${tx}</div></div>`).join('')}</div>`);
  }
  const node=g=>{
    const ts=todosOf(g.id).filter(t=>!t.done), late=ts.filter(t=>!t.candidate&&t.due&&t.due<jst()).length;
    const kids=children(g.id).filter(k=>!closed(k));
    return `<li><div class="node">${chip(layerOf(g))}<a href="#goal-${esc(g.id)}"><span class="dot" style="--c:${colorOf(g)}"></span> ${esc(g.title)}</a>${ts.length?`<span class="tcount">${chip('L5')} ${ts.filter(t=>!t.candidate).length}件${ts.some(t=>t.candidate)?`・候補${ts.filter(t=>t.candidate).length}`:''}</span>`:''}${late?`<span class="pill late">期限超過 ${late}</span>`:''}</div>${kids.length?`<ul>${kids.map(node).join('')}</ul>`:''}</li>`;
  };
  const used=new Set();
  const roleMaps=D.roles.map(r=>{
    const gs=tops.filter(g=>!used.has(g.id)&&g.roles[0]===r.id); gs.forEach(g=>used.add(g.id));
    return `<details class="rolemap" open><summary>${chip('L2')}<h3>${esc(r.name)}</h3><span class="tcount">目標 ${gs.length}</span></summary><p class="empty">${esc(r.vision)}</p><div class="tree"><ul>${gs.map(node).join('')||'<li class="empty">まだ目標がありません。</li>'}</ul></div></details>`;
  }).join('');
  return `<div class="view-in"><h2 class="view">人生帳の地図</h2><p class="lead">上ほど大きく長い目的、下ほど小さく今日の一歩。下の層は必ず上の層につながっています。</p>
    <div class="pyr" role="img" aria-label="ミッション、役割、目標、案件、ToDoの5層">${LAYERS.map(([lv,name],i)=>`<div class="band ${lv}" style="width:${widths[i]}">${name}<span>${counts[lv]}</span></div>`).join('')}</div>
    <dl class="layers">${LAYERS.map(([lv,name,desc])=>`<div><dt>${chip(lv)}</dt><dd>${desc}</dd><dd class="ex">例：${esc(ex[lv])}</dd></div>`).join('')}</dl>
    ${ladder}
    ${sec('役割ごとの地図', `<div class="sec" style="margin:0">${roleMaps}</div>`)}
  </div>`;
}

/* ---------- 目標 ---------- */
function goalCard(g){
  const all=[g,...descendants(g.id)]; const ts=all.flatMap(x=>todosOf(x.id)).filter(t=>!t.candidate);
  const done=ts.filter(t=>t.done).length, total=ts.length;
  const lateN=ts.filter(t=>!t.done&&t.due&&t.due<jst()).length;
  const kids=children(g.id).sort((a,b)=>closed(a)-closed(b));
  return `<article class="goal" style="--c:${colorOf(g)}">
    <a class="ttl" href="#goal-${esc(g.id)}">${chip(layerOf(g))} ${esc(g.title)}</a>
    <div class="meta"><span class="pill">${esc(g.kind)}</span><span class="pill ${g.status==='進行中'?'doing':''}">${esc(g.status)}</span>${g.due?`<span class="pill">期限 ${esc(g.due)}</span>`:''}${total?`<span>ToDo ${done}/${total}</span>`:''}${lateN?`<span class="pill late">期限超過 ${lateN}</span>`:''}</div>
    ${total?`<div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div>`:''}
    ${kids.length?`<div class="kids">${kids.map(k=>{const kt=[k,...descendants(k.id)].flatMap(x=>todosOf(x.id)).filter(t=>!t.done&&!t.candidate).length;return `<div class="kid"><a href="#goal-${esc(k.id)}"><span class="dot" style="--c:${colorOf(k)}"></span> ${esc(k.title)}</a><span class="meta">${kt?`未完了 ${kt}`:esc(k.status)}</span></div>`}).join('')}</div>`:''}
  </article>`;
}
function viewGoals(){
  const tops=D.goals.filter(g=>!g.parent);
  const used=new Set();
  const blocks=D.roles.map(r=>{
    const gs=tops.filter(g=>!used.has(g.id)&&g.roles[0]===r.id); gs.forEach(g=>used.add(g.id));
    if(!gs.length) return '';
    return `<section class="role"><header>${chip('L2')}<h3>${esc(r.name)}</h3><p>${esc(r.vision)}</p></header>${gs.map(goalCard).join('')}</section>`;
  }).join('');
  const rest=tops.filter(g=>!used.has(g.id));
  return `<div class="view-in"><h2 class="view">目標の木</h2><p class="lead">役割ごとに、大きな目標から案件、ToDoへ下りていきます。</p>${blocks}${rest.length?`<section class="role"><header><h3>その他</h3></header>${rest.map(goalCard).join('')}</section>`:''}</div>`;
}
function viewGoal(id){
  const g=goalById(id); if(!g) return `<p class="empty">目標が見つかりません。</p>`;
  const ts=todosOf(g.id); const open=ts.filter(t=>!t.done).sort((a,b)=>(a.candidate-b.candidate)||((a.due||'9')).localeCompare(b.due||'9')); const done=ts.filter(t=>t.done);
  const decs=D.decisions.filter(d=>d.goals.includes(g.id));
  const wishes=D.wishes.filter(w=>g.wishes.includes(w.id));
  const kids=children(g.id);
  const block=(t,b,extra='')=>b?`<section class="sec"><header><h3>${t}</h3>${extra}</header><div class="paper prose">${md(b)}</div></section>`:'';
  return `<div class="view-in" style="--c:${colorOf(g)}">
    <nav class="crumbs"><a href="#goals">目標</a>${ancestors(g).map(a=>` › <a href="#goal-${esc(a.id)}">${esc(a.title)}</a>`).join('')}</nav>
    <h2 class="view">${chip(layerOf(g))} ${esc(g.title)}</h2>
    <div class="meta" style="margin-bottom:8px"><span class="pill">${esc(g.kind)}</span><span class="pill ${g.status==='進行中'?'doing':''}">${esc(g.status)}</span>${g.due?`<span class="pill">期限 ${esc(g.due)}（あと${diff(jst(),g.due)}日）</span>`:''}${g.roles.map(r=>`<span class="pill">${esc(roleName(r))}</span>`).join('')}${g.origin==='整理案'?'<span class="pill cand">整理案</span>':''}</div>
    ${g.wait?`<p class="hint">待っていること：${esc(g.wait)}</p>`:''}
    ${block('なぜ大切か',g.why)}
    ${block('目指す状態',g.ideal)}
    ${block('今の状況',g.now, g.nowUpdated?`<span class="count">更新 ${esc(g.nowUpdated)}</span>`:'')}
    ${block('次の一歩',g.next)}
    ${sec('ToDo', todoList(open,{limit:99})+(done.length?`<details class="fold"><summary>完了 ${done.length}件</summary>${todoList(done,{limit:99})}</details>`:''), open.length)}
    ${kids.length?sec('この下の目標・案件', kids.map(goalCard).join('')):''}
    ${decs.length?sec('判断', decs.map(decCard).join('')):''}
    ${wishes.length?sec('つながる願い', `<ul class="prose">${wishes.map(w=>`<li>${esc(w.text)}</li>`).join('')}</ul>`):''}
    ${block('資料',g.links)}
    ${g.source?`<p class="empty">出典：${esc(g.source)}</p>`:''}
  </div>`;
}

/* ---------- 判断 ---------- */
function decCard(d){
  const s=d.sec||{}; const goals=d.goals.map(goalById).filter(Boolean);
  return `<article class="paper dec"><div class="meta"><span class="d">${esc(d.date)}</span><span class="pill ${d.status==='有効'?'ok':''}">${esc(d.status)}</span>${d.origin==='整理案'?'<span class="pill cand">整理案</span>':''}${goals.map(g=>`<a href="#goal-${esc(g.id)}"><span class="dot" style="--c:${colorOf(g)}"></span> ${esc(g.title)}</a>`).join('')}${d.review?`<span class="pill">見直し ${esc(d.review)}</span>`:''}</div>
    <h3>${esc(d.id.replace(/^\d{4}-\d{2}-\d{2}_/,''))}</h3>
    <div class="prose">${md(s['決めたこと'])}</div>
    ${(s['理由']||s['検討した他の案']||s['前提・見直す条件'])?`<details class="fold"><summary>理由・他の案・見直す条件</summary><div class="prose">${s['理由']?'<h4>理由</h4>'+md(s['理由']):''}${s['検討した他の案']?'<h4>検討した他の案</h4>'+md(s['検討した他の案']):''}${s['前提・見直す条件']?'<h4>前提・見直す条件</h4>'+md(s['前提・見直す条件']):''}</div></details>`:''}
    ${d.source?`<span class="meta">出典：${esc(d.source)}</span>`:''}
  </article>`;
}
function viewDecisions(){
  const list=D.decisions.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const live=list.filter(d=>d.status!=='置き換え済み'), old=list.filter(d=>d.status==='置き換え済み');
  return `<div class="view-in"><h2 class="view">判断の記録</h2><p class="lead">何を、なぜ決めたか。次に迷ったときの判断基準になります。</p>
    <div class="sec">${live.map(decCard).join('')||'<p class="empty">まだありません。</p>'}</div>
    ${old.length?`<details class="fold"><summary>置き換えた判断 ${old.length}件</summary><div class="sec">${old.map(decCard).join('')}</div></details>`:''}</div>`;
}

let current='today';
function go(view){
  current=view||'today';
  try{ if(location.hash.slice(1)!==current) history.replaceState(null,'','#'+current); }catch(_){}
  route(current);
}
function route(view){
  const h=view||(location.hash||'#today').slice(1)||'today';
  current=h;
  const base=h.startsWith('goal-')?'goals':h;
  for(const id of ['tabs-top','tabs-bottom']) document.getElementById(id).innerHTML=TABS.map(([k,l])=>`<a href="#${k}" ${k===base?'aria-current="page"':''}>${l}</a>`).join('');
  let html;

/* ---------- 合言葉で開く ---------- */
// 合言葉 → (PBKDF2) → 秘密鍵を取り出す → (RSA-OAEP) 包まれた鍵を開く → (AES-GCM) データを開く
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normPass=s=>String(s).normalize('NFKC').replace(/\s+/gu,'');
async function aesOpen(rawKey,iv,ct){
  const key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
}
async function unlockPrivate(pass,priv){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(normPass(pass)),'PBKDF2',false,['deriveBits']);
  const kek=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(priv.salt),iterations:priv.iter,hash:'SHA-256'},base,256);
  return aesOpen(new Uint8Array(kek),b64(priv.iv),b64(priv.ct)); // pkcs8
}
async function openWithPrivate(pkcs8,p){
  const pk=await crypto.subtle.importKey('pkcs8',pkcs8,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
  const k=new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},pk,b64(p.wk)));
  return JSON.parse(new TextDecoder().decode(await aesOpen(k,b64(p.iv),b64(p.ct))));
}
async function openPayload(pass,p){ return openWithPrivate(await unlockPrivate(pass,p.priv),p); }
const REMEMBER=p=>'lifeplan-key-'+p.priv.salt; // 合言葉を変えない限り、更新後も覚えたまま
async function boot(){
  const p=PAYLOAD;
  if(!p){ app.innerHTML='<p class="empty">データがありません。</p>'; return; }
  if(p.mode==='plain'){ start(p.data); return; }
  try{ const saved=localStorage.getItem(REMEMBER(p)); if(saved){ start(await openWithPrivate(b64(saved),p)); return; } }catch(_){}
  document.querySelector('header.top').hidden=true; document.querySelector('.tabbar').hidden=true;
  app.innerHTML=`<div class="lock"><form id="lock"><h1>わたしの人生帳</h1><label for="pass">合言葉</label><span style="font-size:.8rem;color:var(--muted)">空白の有無や全角・半角は区別しません</span><div class="passrow"><input id="pass" type="text" class="masked" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="ja" inputmode="text" required><button type="button" class="copy" id="showpass" aria-pressed="false">表示</button></div><label style="display:flex;gap:8px;align-items:center;font-size:.9rem"><input id="remember" type="checkbox"> この端末では次から入力しない</label><button type="submit">開く</button><p class="err" id="err" hidden>合言葉が違います。もう一度入力してください。</p></form></div>`;
  const sp=document.getElementById('showpass'), pi=document.getElementById('pass');
  sp.addEventListener('click',()=>{const on=pi.classList.toggle('masked'); sp.textContent=on?'表示':'隠す'; sp.setAttribute('aria-pressed',String(!on)); pi.focus();});
  document.getElementById('lock').addEventListener('submit',async e=>{
    e.preventDefault(); const btn=e.target.querySelector('button'); btn.textContent='確認しています…'; btn.disabled=true;
    try{
      const pkcs8=await unlockPrivate(document.getElementById('pass').value,p.priv); const data=await openWithPrivate(pkcs8,p);
      if(document.getElementById('remember').checked){ try{ localStorage.setItem(REMEMBER(p),btoa(String.fromCharCode(...pkcs8))); }catch(_){} }
      document.querySelector('header.top').hidden=false; document.querySelector('.tabbar').hidden=false; start(data);
    }catch(_){ document.getElementById('err').hidden=false; btn.textContent='開く'; btn.disabled=false; }
  });
}
boot();
